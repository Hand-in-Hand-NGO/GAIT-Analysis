[project]
name = "gaitapp"
version = "0.1.0"
description = "Desktop gait-analysis app: counts steps and gait metrics from front+side patient walking video pairs."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gaitapp*"]

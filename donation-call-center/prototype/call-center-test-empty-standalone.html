<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كول سنتر التبرعات — تجربة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: RTL operational app — dark sidebar at the inline start, work area beside it; a slim prototype bar on top is clearly separate from the product. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --surface-2: #f6f8f9; --hover: #eef2f4; --line: #e1e6ea; --line-strong: #cbd3d9;
  --fg: #16222b; --fg-2: #3c4a55; --muted: #6a7883;
  --accent: #0b6b62; --accent-hover: #095a52; --accent-ink: #ffffff; --accent-soft: #e2f1ee;
  --side: #10282a; --side-fg: #d6e4e2; --side-muted: #86a3a0; --side-active: #1d4643;
  --demo: #fff6e2; --demo-line: #f0dfb4; --demo-fg: #6b4e0b;
  --ok: #1b7f45; --ok-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fcf0d9;
  --bad: #b42318; --bad-soft: #fde8e6; --info: #2558a6; --info-soft: #e5edfa; --neutral-soft: #edf0f2;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --r: 6px; --ctl: 36px;
  --shadow: 0 1px 2px rgb(16 34 43 / .06), 0 4px 16px rgb(16 34 43 / .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1518; --surface: #151f23; --surface-2: #19252a; --hover: #1f2d33; --line: #26353b; --line-strong: #33464e;
  --fg: #e4ecef; --fg-2: #bccad0; --muted: #8b9ca3;
  --accent: #3fb5a5; --accent-hover: #5cc6b7; --accent-ink: #062320; --accent-soft: #163a36;
  --side: #0a1214; --side-fg: #d2e0de; --side-muted: #7f9895; --side-active: #173634;
  --demo: #2b2412; --demo-line: #4a3c17; --demo-fg: #f1d48a;
  --ok: #5fd08f; --ok-soft: #173525; --warn: #f2b45a; --warn-soft: #3a2b12;
  --bad: #f38b80; --bad-soft: #3d1d1a; --info: #8fb6f2; --info-soft: #1a2a44; --neutral-soft: #222f34;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1518; --surface: #151f23; --surface-2: #19252a; --hover: #1f2d33; --line: #26353b; --line-strong: #33464e;
  --fg: #e4ecef; --fg-2: #bccad0; --muted: #8b9ca3;
  --accent: #3fb5a5; --accent-hover: #5cc6b7; --accent-ink: #062320; --accent-soft: #163a36;
  --side: #0a1214; --side-fg: #d2e0de; --side-muted: #7f9895; --side-active: #173634;
  --demo: #2b2412; --demo-line: #4a3c17; --demo-fg: #f1d48a;
  --ok: #5fd08f; --ok-soft: #173525; --warn: #f2b45a; --warn-soft: #3a2b12;
  --bad: #f38b80; --bad-soft: #3d1d1a; --info: #8fb6f2; --info-soft: #1a2a44; --neutral-soft: #222f34;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .3); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 var(--font); direction: rtl; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 20px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; line-height: 1.4; }
h3 { font-size: 13px; font-weight: 600; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.num, td.num { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* prototype bar */
.demo { background: var(--demo); border-bottom: 1px solid var(--demo-line); color: var(--demo-fg); font-size: 13px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.demo b { font-weight: 600; }
.demo select, .demo .dbtn { height: 28px; border: 1px solid var(--demo-line); background: var(--surface); border-radius: var(--r); padding: 0 8px; cursor: pointer; color: var(--fg); font-size: 13px; }
.demo .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.demo .sep { width: 1px; height: 18px; background: var(--demo-line); }

/* shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100% - 41px); }
.side { background: var(--side); color: var(--side-fg); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px;
  padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.logo { display: flex; flex-direction: column; padding: 0 10px; }
.logo b { font-size: 15px; color: #fff; } .logo span { font-size: 12px; color: var(--side-muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); color: var(--side-fg); text-decoration: none; cursor: pointer; }
.nav a:hover { background: var(--side-active); }
.nav a[aria-current="page"] { background: var(--side-active); color: #fff; font-weight: 600; box-shadow: inset -3px 0 0 var(--accent-hover); }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav .count { margin-inline-start: auto; background: var(--bad); color: #fff; border-radius: 999px; font-size: 11.5px; padding: 0 7px; line-height: 19px; font-variant-numeric: tabular-nums; }
.who { margin-top: auto; padding: 10px; border-top: 1px solid var(--side-active); display: flex; gap: 10px; align-items: center; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; flex: none; }
.who div { display: flex; flex-direction: column; line-height: 1.3; } .who small { color: var(--side-muted); }
main { min-width: 0; padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 24px; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; justify-content: space-between; }
.page-head .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.crumb { font-size: 12.5px; color: var(--muted); } .crumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* controls */
.btn { height: var(--ctl); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border-radius: var(--r);
  border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.input, select.input, textarea.input { height: var(--ctl); border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 0 10px; min-width: 0; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; color: var(--fg-2); }
.field .hint { font-size: 12px; color: var(--muted); }
.req::after { content: " *"; color: var(--bad); }
.seg { align-self: flex-start; display: inline-flex; background: var(--neutral-soft); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 6px; cursor: pointer; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.search { position: relative; } .search svg { position: absolute; top: 10px; right: 10px; width: 16px; height: 16px; color: var(--muted); }
.search .input { padding-right: 32px; width: 240px; max-width: 100%; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-b { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-inline-start: 1px solid var(--line); }
.stat:first-child { border-inline-start: 0; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat small { font-size: 12.5px; color: var(--fg-2); font-variant-numeric: tabular-nums; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 14px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; z-index: 1; }
td.num, th.num { text-align: end; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.link { cursor: pointer; } tbody tr.link:hover { background: var(--hover); }
td .sub { display: block; font-size: 12px; color: var(--muted); }
td.chk, th.chk { width: 36px; padding-inline-end: 0; }

/* status */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 9px 2px 10px; border-radius: 999px; background: var(--neutral-soft); color: var(--fg-2); white-space: nowrap; font-weight: 500; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.st.success { background: var(--ok-soft); color: var(--ok); } .st.positive { background: var(--accent-soft); color: var(--accent); }
.st.pending { background: var(--info-soft); color: var(--info); } .st.unreachable { background: var(--warn-soft); color: var(--warn); }
.st.negative, .st.invalid { background: var(--bad-soft); color: var(--bad); }
.due { font-size: 12.5px; font-variant-numeric: tabular-nums; } .due.over { color: var(--bad); font-weight: 600; }
.tag.k-prospect { background: var(--info-soft); color: var(--info); } .tag.k-donor { background: var(--ok-soft); color: var(--ok); } .tag.k-conv { background: var(--ok); color: #fff; }
.types { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px; }
.type { border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; background: var(--surface); }
.type input { accent-color: var(--accent); width: 16px; height: 16px; margin-top: 3px; }
.type span { display: flex; flex-direction: column; } .type small { color: var(--muted); font-size: 12.5px; }
.type:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.drop[aria-disabled="true"] { opacity: .5; pointer-events: none; }
table.team th .sub { display: block; font-weight: 400; font-size: 11.5px; }
table.team th, table.team td { padding: 10px 10px; } table.team th { white-space: normal; vertical-align: bottom; }
table.team .acts { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
tfoot td { background: var(--surface-2); border-top: 1px solid var(--line-strong); border-bottom: 0; }
.tgt { display: flex; flex-direction: column; gap: 4px; min-width: 120px; } .tgt .input { height: 30px; width: 80px; }
.srcs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.src { display: inline-flex; gap: 8px; justify-content: space-between; align-items: center; font-size: 12.5px; background: var(--neutral-soft); border-radius: 4px; padding: 2px 8px; max-width: 210px; }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .count.soft { background: var(--side-active); color: var(--side-fg); }
.nav a[aria-current="page"] .count.soft { background: var(--accent-hover); color: var(--accent-ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px; }
.tile { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; color: inherit; }
.tile:hover:not(:disabled) { border-color: var(--accent); box-shadow: var(--shadow); }
.tile:disabled { cursor: default; opacity: .7; }
.tile-h { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.tile-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.tile-ic svg { width: 18px; height: 18px; }
.tile.done .tile-ic { background: var(--neutral-soft); color: var(--muted); }
.tile-n { display: flex; align-items: baseline; gap: 8px; } .tile-n b { font-size: 30px; line-height: 1; } .tile-n span { color: var(--muted); }
.tile-f { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
.tile-go { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; } .tile-go svg { width: 16px; height: 16px; transform: scaleX(-1); }
.pill { display: inline-flex; gap: 6px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.pill b { color: var(--fg); font-size: 15px; }
.call-solo { max-width: 860px; }
.suffix { display: flex; align-items: center; gap: 8px; } .suffix .input { width: 96px; } .suffix span { color: var(--muted); font-size: 13px; }
.alarm { position: sticky; top: 0; z-index: 8; background: var(--bad); color: #fff; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.alarm .ic svg { width: 20px; height: 20px; } .alarm .tx { flex: 1; min-width: 200px; display: flex; flex-direction: column; font-size: 13px; }
.alarm .btn { background: transparent; color: #fff; border-color: rgb(255 255 255 / .6); } .alarm .btn:hover { background: rgb(255 255 255 / .15); }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.gate .empty { padding: 48px 16px; gap: 10px; } .gate .big { font-size: 40px; color: var(--fg); } .gate.over { border-color: var(--bad); }
.sched td { padding: 8px 10px; } .sched select { height: 32px; }
.chip-btn { display: inline-flex; align-items: center; gap: 5px; } .chip-btn svg { width: 14px; height: 14px; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px; }
.section-card .card-h h2 { display: inline-flex; gap: 8px; align-items: center; } .section-card .card-h h2 svg { width: 18px; height: 18px; color: var(--accent); }
.big-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .big-pair div { display: flex; flex-direction: column; } .big-pair b { font-size: 32px; line-height: 1.1; } .big-pair span { color: var(--muted); font-size: 13px; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 10px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.progress-box { display: flex; flex-direction: column; gap: 8px; padding: 6px 0; } .meter.big { height: 10px; }
.meter i.indet { width: 35%; animation: indet 1.2s ease-in-out infinite alternate; } @keyframes indet { from { margin-inline-start: 0; } to { margin-inline-start: 65%; } }
.formula { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--neutral-soft); color: var(--fg-2); }

/* meters */
.meter { height: 6px; background: var(--neutral-soft); border-radius: 3px; overflow: hidden; display: flex; min-width: 80px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter i.ok { background: var(--ok); } .meter i.warn { background: var(--warn); } .meter i.bad { background: var(--bad); } .meter i.info { background: var(--info); }
.mrow { display: flex; align-items: center; gap: 8px; } .mrow .meter { flex: 1; min-width: 56px; }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar { display: grid; grid-template-columns: 130px 1fr 72px; gap: 10px; align-items: center; font-size: 13px; }
.bar .meter { height: 8px; } .bar .v { text-align: end; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.bar-group { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }

/* attention list */
.alerts { display: flex; flex-direction: column; }
.alert { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.alert:last-child { border-bottom: 0; }
.alert .ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.alert .ic svg { width: 18px; height: 18px; }
.alert .ic.bad { background: var(--bad-soft); color: var(--bad); } .alert .ic.warn { background: var(--warn-soft); color: var(--warn); } .alert .ic.info { background: var(--info-soft); color: var(--info); }
.alert .tx { flex: 1; min-width: 200px; display: flex; flex-direction: column; }

/* empty */
.empty { padding: 36px 16px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; color: var(--muted); }
.empty b { color: var(--fg); font-size: 14.5px; }

/* dialogs */
dialog { border: 0; padding: 0; border-radius: 12px; background: var(--surface); color: var(--fg); box-shadow: 0 20px 60px rgb(0 0 0 / .3); width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgb(10 20 24 / .5); }
dialog.drawer { margin: 0; margin-right: auto; height: 100%; max-height: 100%; width: min(520px, 100vw); border-radius: 0; }
.dlg { display: flex; flex-direction: column; max-height: inherit; height: 100%; }
.dlg-h { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dlg-b { padding: 18px 20px; overflow: auto; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.dlg-f { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap; align-items: center; }
.x { width: 32px; height: 32px; border-radius: var(--r); border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: none; }
.x:hover { background: var(--hover); } .x svg { width: 18px; height: 18px; }
.steps { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.steps .on { color: var(--accent); font-weight: 600; } .steps .done { color: var(--ok); }
.drop { border: 2px dashed var(--line-strong); border-radius: 10px; padding: 30px 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 34px; height: 34px; color: var(--accent); }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.checks > div { padding: 10px 14px; display: flex; flex-direction: column; border-inline-start: 1px solid var(--line); }
.checks > div:first-child { border-inline-start: 0; }
.checks b { font-size: 18px; font-variant-numeric: tabular-nums; } .checks span { font-size: 12.5px; color: var(--muted); }
.checks .okc b { color: var(--ok); } .checks .warnc b { color: var(--warn); } .checks .badc b { color: var(--bad); }
.note { padding: 10px 14px; border-radius: 8px; background: var(--info-soft); color: var(--info); font-size: 13px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }

/* agent picker chips */
.picks { display: flex; flex-wrap: wrap; gap: 8px; }

/* ================= index (rebuilt lazily after every change) ================= */
let IDX = null;
const invalidate = () => { IDX = null; };
const isPoolItem = (d) => d.agent == null && d.status === "new" && !d.dnc && (d.kind === "prospect" || !!d.returnedAt);
function idx() {
  if (IDX) return IDX;
  const byAgent = new Map(), pool = [];
  let holds = 0;
  for (const d of S.donors) {
    if (d.agent != null) { let a = byAgent.get(d.agent); if (!a) byAgent.set(d.agent, (a = [])); a.push(d); }
    else if (isPoolItem(d)) pool.push(d);
    if (d.status === "hold") holds++;
  }
  // names coming back from a hold have waited longest, so they go first; then import order
  pool.sort((a, b) => (a.returnedAt ? 0 : 1) - (b.returnedAt ? 0 : 1) || (a.returnedAt || 0) - (b.returnedAt || 0) || a.id - b.id);
  return (IDX = { byAgent, pool, holds });
}
const mineOf = (agentId) => idx().byAgent.get(agentId) || [];

/* ================= 2-month holds ("لا يرد" ×3 and "غير مهتم") ================= */
const addMonths = (t, m) => { const d = new Date(t); d.setMonth(d.getMonth() + m); return d.getTime(); };
const HOLD_REASONS = { no_answer: "لا يرد ٣ مرات", not_interested: "غير مهتم" };
function putOnHold(d, reason) {
  S.moves.push({ t: S.now, donor: d.id, from: d.agent, to: null, why: "توقف: " + HOLD_REASONS[reason] });
  d.lastAgent = d.agent; d.agent = null;
  d.status = "hold"; d.holdReason = reason; d.holdAt = S.now; d.holdUntil = addMonths(S.now, S.settings.cycle.holdMonths); d.next = null;
}
/* after the hold ends the name goes back to the distribution pool, never to the agent who had it last */
function releaseHolds() {
  let k = 0;
  for (const d of S.donors) {
    if (d.status !== "hold" || d.holdUntil > S.now) continue;
    d.status = "new"; d.excludeAgent = d.lastAgent; d.returnedAt = d.holdUntil; d.lastHoldReason = d.holdReason;
    d.cycle = (d.cycle || 1) + 1; d.noAns = 0; d.tries = 0; d.next = null;
    d.holdReason = null; d.holdUntil = null; k++;
  }
  if (k) invalidate();
  return k;
}

/* ================= batch size per agent ================= */
const eligibleAgents = () => S.agents.filter((a) => a.active && !S.settings.alloc.excluded.includes(a.id));
/* expected attempts one new name takes: answered on try 1, or retried up to the "لا يرد" limit */
const attemptsPerName = (p, limit) => { let e = 0; for (let k = 0; k < limit; k++) e += Math.pow(1 - p, k); return e; };
function agentRate(agentId, cfg = S.settings) {
  const a = cfg.alloc, from = S.now - a.windowDays * D;
  let attempts = 0, answered = 0; const days = new Set();
  for (const c of S.calls) {
    if (c.agent !== agentId || c.t < from || c.t > S.now || c.outcome === "duplicate") continue;
    attempts++; if (OC[c.outcome].group === "ans") answered++; days.add(dayStart(c.t));
  }
  const isNew = attempts < a.minHistory;
  const p = attempts ? answered / attempts : 0, avgDaily = days.size ? attempts / days.size : 0;
  const per = attemptsPerName(p, cfg.cycle.noAnsLimit);
  const raw = isNew ? a.fresh : (avgDaily / per) * a.days;
  const size = Math.max(a.min, Math.min(a.max, Math.round(raw)));
  return { attempts, answered, activeDays: days.size, avgDaily, p, per, raw, size, isNew, clamped: !isNew && size !== Math.round(raw) };
}
const readyFresh = (agentId) => mineOf(agentId).filter((d) => catOf(d) === "fresh").length;

/* give a new batch to every eligible agent whose ready new names ran out */
function autoAllocate(force = false) {
  if (!S.settings.alloc.auto && !force) return 0;
  const pool = idx().pool;
  if (!pool.length) return 0;
  let given = 0;
  const taken = new Set(), elig = eligibleAgents();
  // names back from a hold go out right away to the least-loaded agent who is not the last one; with nobody else available they wait
  const load = new Map(elig.map((a) => [a.id, openOf(a.id).length]));
  for (const d of pool) {
    if (!d.returnedAt) continue;
    const options = elig.filter((a) => a.id !== d.excludeAgent);
    if (!options.length) continue;
    const to = options.reduce((m, a) => (load.get(a.id) < load.get(m.id) ? a : m));
    taken.add(d.id); assign(d, to.id, "رجوع من التوقف"); d.allocAt = S.now; d.excludeAgent = null; load.set(to.id, load.get(to.id) + 1); given++;
  }
  for (const a of elig) {
    if (readyFresh(a.id) > 0) continue;
    const size = agentRate(a.id).size;
    let k = 0;
    for (const d of pool) {
      if (k >= size) break;
      if (taken.has(d.id) || d.agent != null || d.excludeAgent === a.id) continue;   // one agent per name, never back to the last agent
      taken.add(d.id); assign(d, a.id, "دفعة تلقائية"); d.allocAt = S.now; d.excludeAgent = null; k++;
    }
    if (k) { S.allocLog.unshift({ t: S.now, agent: a.id, count: k, size }); given += k; }
    if (taken.size >= pool.length) break;
  }
  if (S.allocLog.length > 200) S.allocLog.length = 200;
  if (given) invalidate();
  return given;
}

function simulate(share, hours = 10) {
  const r = S.r, base = dayStart(S.now) + 10 * H;
  if (hours === 10) S.agents.filter((a) => a.active && !shiftOf(a.id, dayStart(base))).forEach((a) => makeShift(a.id, dayStart(base), r));
  const W = { donated: 11, pledged: 8, will_call: 8, callback: 7, send_info: 4, donated_elsewhere: 2, not_interested: 11, do_not_call: 2, no_answer: 22, busy: 6, phone_off: 12, wrong_number: 3, not_in_service: 2 };
  const codes = Object.keys(W), tot = codes.reduce((s, c) => s + W[c], 0);
  let made = 0;
  for (const a of S.agents.filter((x) => x.active)) {
    const q = queueOf(a.id).all.filter((d) => !isClosed(d) && (d.next === null || d.next <= base + 10 * H));
    const todo = q.slice(0, Math.round(Math.min(q.length, a.target) * share));
    todo.forEach((d, i) => {
      S.now = base + Math.floor((i / Math.max(1, todo.length)) * hours * H) + Math.floor(r() * (hours < 10 ? 5 : 25)) * MIN;
      if ((d.next && d.next > S.now) || isClosed(d) || d.agent !== a.id) return;
      let x = r() * tot, code = codes[0];
      for (const c of codes) { x -= W[c]; if (x <= 0) { code = c; break; } }
      if (d.status === "pledged" && r() < .65) code = "donated";
      const o = OC[code];
      const amt = d.status === "pledged" && code === "donated" ? d.pledge : [100, 200, 250, 500, 1000][Math.floor(r() * 5)];
      const phone = d.phones.findIndex((p) => !p.bad);
      logCall(d, a.id, { outcome: code, phone, amount: o.amount ? amt : null, pay: code === "donated" ? PAYMENTS[Math.floor(r() * 4)] : null,
        follow: o.follow === "req" ? S.now + (1 + Math.floor(r() * 3)) * D : null });
      made++;
    });
  }
  S.now = base + hours * H + 10 * MIN;
  return made;
}

function makeRows(count, r, withIssues) {
  const pick = (a) => a[Math.floor(r() * a.length)];
  const ph = () => "01" + pick(["0", "1", "2", "5"]) + String(10000000 + Math.floor(r() * 89999999));
  const rows = [];
  for (let i = 0; i < count; i++) {
    const p1 = ph(), roll = r();
    rows.push([`${pick(FIRST)} ${pick(LAST)}`, roll < .2 ? `${p1} / ${ph()}` : p1, roll > .7 ? ph() : "", roll > .9 ? "متبرع قديم" : ""]);
  }
  if (withIssues) {
    rows.push([rows[3][0], rows[3][1], "", ""]);
    rows.push(["محمود عبد الرحمن", "0123", "", ""]);
    rows.push(["", "01098765432", "", ""]);
    rows.push(["هالة منصور", "+20 100 222 3344", "٠١١٢٣٤٥٦٧٨٩", "اتصل بعد العصر"]);
  }
  return rows;
}

  S = { settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), now: Date.now(), r: rng(11), seq: 1, role: "manager", view: "home", param: null,
    agents: [], batches: [], donors: [], calls: [], moves: [], shifts: {}, allocLog: [], ui: {} };

  S.agents = [...leaders, ...agents].map((name, i) => ({ id: 100 + i, name, target: i < leaders.length ? 30 : 40, active: true }));
  S.settings.sched = Object.fromEntries(S.agents.map((a) => [a.id, { start: 10, end: 18 }]));

function stats(range, { agent, batch, agents } = {}) {
  const inRange = S.calls.filter((c) => c.t >= range[0] && c.t < range[1] && (!agent || c.agent === agent) && (!batch || c.batch === batch) && (!agents || agents.includes(c.agent)));
  const cs = inRange.filter((c) => c.outcome !== "duplicate"), dups = inRange.length - cs.length;
  const by = (code) => cs.filter((c) => c.outcome === code);
  const answered = cs.filter((c) => OC[c.outcome].group === "ans");
  const donated = by("donated"), pledged = by("pledged");
  const answeredDonors = new Set(answered.map((c) => c.donor));
  return {
    cs, calls: cs.length, answered: answered.length, ansRate: pct(answered.length, cs.length),
    donated: donated.length, amount: donated.reduce((s, c) => s + c.amount, 0),
    pledged: pledged.length, pledgedAmt: pledged.reduce((s, c) => s + c.amount, 0),
    fulfilled: donated.filter((c) => S.calls.some((x) => x.donor === c.donor && x.outcome === "pledged" && x.t < c.t)).length,
    interested: by("will_call").length, followReq: by("callback").length + by("send_info").length,
    noAns: by("no_answer").length + by("busy").length, off: by("phone_off").length,
    refused: by("donated_elsewhere").length + by("not_interested").length + by("do_not_call").length,
    badNum: by("wrong_number").length + by("not_in_service").length,
    conv: pct(new Set(donated.map((c) => c.donor)).size, answeredDonors.size),
    converted: cs.filter((c) => c.converted).length, dups, all: inRange,
  };
}

function readFile(file) {
  const err = $("#upErr");
  if (!S.ui.upType) { err.textContent = "اختار نوع الداتا الأول: متبرعين ولا متبرعين محتملين."; return; }
  const body = $("#upBody"), started = performance.now();
  const busy = (msg) => { body.innerHTML = `<div class="steps"><span class="on">جاري تجهيز الملف…</span></div><div class="progress-box"><div class="meter big"><i class="info indet"></i></div><p class="small" id="upMsg">${msg}</p></div><p class="small" id="upErr" role="alert" style="color:var(--bad)"></p>`; };
  const fail = (msg) => { uploadDialog(); $("#upErr").textContent = msg; };
  const reader = new FileReader();
  reader.onerror = () => fail("معرفناش نقرأ الملف. جرّب تحفظه تاني من إكسيل وارفعه.");
  busy(`بنقرا «${esc(file.name)}» (${n(Math.round(file.size / 1024))} ك.ب)…`);
  const done = (rows) => { S.ui.readMs = performance.now() - started; reviewStep(file.name, rows); };
  if (/\.csv$/i.test(file.name)) {
    reader.onload = () => setTimeout(() => {
      const lines = String(reader.result).replace(/^﻿/, "").split(/\r?\n/);
      const rows = [];
      for (const l of lines) if (l.trim()) rows.push(l.includes('"') ? l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map((c) => c.replace(/^"|"$/g, "")) : l.split(","));
      rows.length ? done(rows) : fail("الملف فاضي.");
    }, 30);
    reader.readAsText(file, "utf-8");
  } else {
    if (!window.XLSX) return fail("قراءة ملفات الإكسيل محتاجة اتصال بالإنترنت. احفظ الملف كـ CSV وارفعه، أو جرّب الملف التجريبي.");
    reader.onload = () => {
      $("#upMsg").textContent = "بنفك ملف الإكسيل… الملفات الكبيرة (مئات الآلاف من الصفوف) ممكن تاخد دقيقة، والصفحة هتقف لحظات لحد ما يخلص.";
      setTimeout(() => {
        try {
          const wb = XLSX.read(new Uint8Array(reader.result), { type: "array", dense: true });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
          if (!rows.length) throw new Error("empty");
          done(rows);
        } catch { fail("الملف ده مش ملف إكسيل صالح، أو أول شيت فيه فاضي."); }
      }, 60);
    };
    reader.readAsArrayBuffer(file);
  }
}
function guessRoles(rows) {
  const head = rows[0].map((h) => String(h).trim());
  const hasHeader = head.some((h) => /اسم|name|موبايل|تليفون|هاتف|رقم|phone|mobile|tel/i.test(h));
  const body = hasHeader ? rows.slice(1) : rows;
  const cols = Math.max(...rows.slice(0, 50).map((r) => r.length));
  const roles = [];
  for (let i = 0; i < cols; i++) {
    const h = hasHeader ? head[i] || "" : "";
    const sample = body.slice(0, 30).map((r) => r[i]).filter((v) => String(v ?? "").trim());
    const phoneShare = sample.filter((v) => splitPhones(v).some(normPhone)).length / Math.max(1, sample.length);
    let role = "skip";
    if (/اسم|name/i.test(h)) role = "name";
    else if (/موبايل|تليفون|هاتف|رقم|phone|mobile|tel|واتس/i.test(h) || phoneShare > .6) role = "phone";
    else if (/ملاحظ|note/i.test(h)) role = "notes";
    roles.push(role);
  }
  if (!roles.includes("name")) { const i = roles.findIndex((r) => r === "skip"); if (i >= 0) roles[i] = "name"; }
  return { hasHeader, head, body, roles };
}
const CHUNK = 5000;
const tick = () => new Promise((r) => setTimeout(r, 0));
/* rows are checked in chunks so the page stays responsive and can show progress */
async function analyzeAsync(body, roles, existing, onProgress, token) {
  const seen = new Set(); const out = { contacts: [], multi: 0, dupFile: 0, dupSystem: [], dupSystemN: 0, invalid: [], invalidN: 0 };
  const nameCols = [], phoneCols = [], noteCols = [];
  roles.forEach((r, k) => (r === "name" ? nameCols : r === "phone" ? phoneCols : r === "notes" ? noteCols : []).push(k));
  for (let start = 0; start < body.length; start += CHUNK) {
    if (token.cancel) return null;
    const end = Math.min(body.length, start + CHUNK);
    for (let i = start; i < end; i++) {
      const row = body[i];
      const name = nameCols.map((k) => String(row[k] ?? "").trim()).filter(Boolean).join(" ");
      const raw = []; for (const k of phoneCols) raw.push(...splitPhones(row[k]));
      if (!name && !raw.length) continue;
      const phones = [...new Set(raw.map(normPhone).filter(Boolean))];
      if (!name || !phones.length) { out.invalidN++; if (out.invalid.length < 200) out.invalid.push({ line: i + 1, name, raw: raw.join(" / "), why: !name ? "مفيش اسم" : "مفيش رقم صحيح" }); continue; }
      if (phones.some((p) => seen.has(p))) { out.dupFile++; continue; }
      const ex = phones.map((p) => existing.get(p)).find(Boolean);
      phones.forEach((p) => seen.add(p));
      if (ex) { out.dupSystemN++; if (out.dupSystem.length < 5) out.dupSystem.push({ name, other: ex.kind === "donor" ? "قاعدة المتبرعين" : batchById(ex.batch).name }); continue; }
      if (phones.length > 1) out.multi++;
      out.contacts.push({ name, phones, notes: noteCols.map((k) => String(row[k] ?? "").trim()).filter(Boolean).join(" — ") });
    }
    onProgress(end / body.length);
    await tick();
  }
  return out;
}

/* ---------- pages of a long list ---------- */
const PAGE = 50;
function pageSlice(list, ui, key = "page") {
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  ui[key] = Math.min(Math.max(1, ui[key] || 1), pages);
  return { rows: list.slice((ui[key] - 1) * PAGE, ui[key] * PAGE), pages, page: ui[key] };
}
const pagerHtml = (id, { page, pages }, total) => pages > 1 ? `<div class="pager" id="${id}"><button class="btn sm" data-pg="-1" ${page <= 1 ? "disabled" : ""}>السابق</button>
  <span class="small muted">صفحة ${n(page)} من ${n(pages)} · ${n(total)} اسم</span><button class="btn sm" data-pg="1" ${page >= pages ? "disabled" : ""}>التالي</button></div>` : "";
function bindPager(id, ui, redraw, key = "page") { $$(`#${id} [data-pg]`).forEach((b) => (b.onclick = () => { ui[key] = (ui[key] || 1) + Number(b.dataset.pg); redraw(); })); }

const xdt = (t) => { if (!t) return ""; const d = new Date(t), z = (x) => String(x).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
function rowFor(d, callsOf) {

    "النوع": d.convertedAt ? "اتحوّل لمتبرع" : d.kind === "prospect" ? "متبرع محتمل" : "متبرع", "الداتا": batchById(d.batch).name,

const exportBatch = (id) => { const b = batchById(id); exportRows(b.name, S.donors.filter((d) => d.batch === id)); };
async function exportRows(title, donors) {
  const callsOf = new Map(); for (const c of S.calls) { let l = callsOf.get(c.donor); if (!l) callsOf.set(c.donor, (l = [])); l.push(c); }
  const rows = donors.map((d) => rowFor(d, callsOf)), calls = callRows(donors);

    const add = (data, name) => { const ws = XLSX.utils.json_to_sheet(data.length ? data : [{}]); ws["!views"] = [{ RTL: true }]; ws["!cols"] = Object.keys(data[0] || {}).map((k) => ({ wch: Math.max(10, k.length + 4) })); XLSX.utils.book_append_sheet(wb, ws, name); };
    wb.Workbook = { Views: [{ RTL: true }] };

    blob = new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })]); filename = `${safe} - ${stamp}.xlsx`;
  } else {
    const keys = Object.keys(rows[0] || {});
    const csv = "﻿" + [keys, ...rows.map((r) => keys.map((k) => r[k]))].map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    blob = new Blob([csv]); filename = `${safe} - ${stamp}.csv`;
  }

  if (dl) {

    catch (e) { if (e?.code !== "declined") toast("التنزيل مش متاح هنا. افتح ملف الـ HTML على جهازك ونزّل منه."); }

  }

  const href = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(new Blob([blob], { type: "application/octet-stream" })); });
  const a = document.createElement("a"); a.href = href; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  toast(`اتنزل الشيت: ${filename} — ${n(rows.length)} اسم و${n(calls.length)} مكالمة`);
}

/* ================= attendance: shifts, pauses, alarms ================= */
const REASONS = { break: "بريك" };
const dur = (ms) => { const m = Math.max(0, Math.round(ms / MIN)), h = Math.floor(m / 60); return h ? `${n(h)} س ${n(m % 60)} د` : `${n(m)} د`; };
const schedOf = (id) => S.settings.sched[id] || { start: 10, end: 18 };
const shiftKey = (id, day = dayStart(S.now)) => `${id}:${day}`;
const shiftOf = (id, day) => S.shifts[shiftKey(id, day)] || null;
function presence(id) {
  const sh = shiftOf(id);
  if (!sh) return "off";
  if (sh.end) return "done";
  return sh.pauses.some((p) => !p.to) ? "paused" : "working";
}
const openPause = (sh) => sh?.pauses.find((p) => !p.to) || null;
const pauseUsed = (sh, r) => (sh ? sh.pauses.filter((p) => p.r === r).reduce((s, p) => s + ((p.to || S.now) - p.from), 0) : 0);
const workedMs = (sh) => (sh ? Math.max(0, ((sh.end || S.now) - sh.start) - sh.pauses.reduce((s, p) => s + ((p.to || S.now) - p.from), 0)) : 0);
function alarmsOf(id) {
  const a = agentById(id), sc = schedOf(id), sh = shiftOf(id), cfg = S.settings.pause, out = [];
  if (!a.active) return out;
  const startAt = dayStart(S.now) + sc.start * H;
  if (!sh && S.now > startAt + 15 * MIN && S.now < dayStart(S.now) + sc.end * H) out.push({ lvl: "warn", t: `${a.name} لسه مبدأش الشغل (معاده ${hourLabel(sc.start)})` });
  if (sh && sh.start > startAt + 10 * MIN) out.push({ lvl: "info", t: `${a.name} بدأ متأخر ${dur(sh.start - startAt)}` });
  const op = openPause(sh);
  if (op && S.now - op.from > cfg.single * MIN) out.push({ lvl: "bad", t: `${a.name} في ${REASONS[op.r]} بقاله ${dur(S.now - op.from)} — المسموح للوقفة الواحدة ${n(cfg.single)} د` });
  for (const r of ["break"]) { const used = pauseUsed(sh, r); if (used > cfg[r] * MIN) out.push({ lvl: "bad", t: `${a.name} تخطى وقت ${REASONS[r]} اليومي: ${dur(used)} من ${n(cfg[r])} د` }); }
  return out;
}
const allAlarms = () => S.agents.flatMap((a) => alarmsOf(a.id).map((x) => ({ ...x, id: a.id })));
function startShift(id) { S.shifts[shiftKey(id)] = { start: S.now, end: null, pauses: [] }; }
function makeShift(id, day, r, opts = {}) {
  const sc = schedOf(id), st0 = day + sc.start * H + Math.floor(r() * (opts.late ?? 12)) * MIN;
  const brk = day + Math.round((sc.start + sc.end) / 2) * H + Math.floor(r() * 30) * MIN;
  S.shifts[shiftKey(id, day)] = { start: st0, end: day + sc.end * H + Math.floor(r() * 10) * MIN, pauses: [
    { r: "break", from: st0 + 2 * H, to: st0 + 2 * H + (4 + Math.floor(r() * 7)) * MIN },
    { r: "break", from: brk, to: brk + (18 + Math.floor(r() * 18)) * MIN },
    { r: "break", from: brk + 3 * H, to: brk + 3 * H + (3 + Math.floor(r() * 6)) * MIN }] };
}

/* manager alarm bar + beep */
let lastBad = 0;
function beep() {
  try { const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    [0, .25].forEach((d) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.12, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d + .2); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .22); });
  } catch { /* sound is optional */ }
}
function updateAlarm() {
  const bar = $("#alarm");
  if (S.role !== "manager") { bar.hidden = true; return; }
  const bad = allAlarms().filter((x) => x.lvl === "bad");
  const key = bad.map((x) => x.t.split(" بقاله")[0]).join("|");
  if (!bad.length || S.ui.alarmAck === key) { bar.hidden = true; lastBad = bad.length; return; }
  bar.hidden = false;
  bar.innerHTML = `<span class="ic">${ic("alert")}</span><div class="tx"><b>${n(bad.length)} تنبيه بريك</b><span>${bad.map((x) => esc(x.t)).join(" · ")}</span></div>
    <button class="btn sm" id="alGo">عرض الحضور</button><button class="btn sm" id="alAck">تمام، شفته</button>`;
  $("#alGo").onclick = () => go("attendance");
  $("#alAck").onclick = () => { S.ui.alarmAck = key; bar.hidden = true; };
  if (bad.length > lastBad) beep();
  lastBad = bad.length;
}

  $("#main").innerHTML = `

    <section class="card"><div class="tw"><table><thead><tr><th>الايجنت</th><th>مواعيده</th><th>دلوقتي</th><th>بدأ</th><th>اشتغل من يومه</th><th>البريك</th><th>تنبيهات</th></tr></thead><tbody>
      ${rows.map(({ a, sc, sh, pr, al }) => { const sched = (sc.end - sc.start) * H, w = workedMs(sh); return `<tr>

        <td>${prChip(pr, sh)}</td><td class="small">${sh ? timeS(sh.start) : "—"}${sh?.end ? `<span class="sub">خلّص ${timeS(sh.end)}</span>` : ""}</td>

        <td>${useCell(sh, "break")}</td>
        <td class="small">${al.length ? al.map((x) => `<span class="st ${x.lvl === "bad" ? "negative" : x.lvl === "warn" ? "unreachable" : "pending"}" style="white-space:normal">${esc(x.t.replace(a.name + " ", ""))}</span>`).join("<br>") : '<span class="muted">—</span>'}</td></tr>`; }).join("")}
    </tbody></table></div></section>
    <section class="card"><div class="card-h"><h2>بريكات النهارده</h2><span class="muted small">${n(log.length)} وقفة</span></div>

      ${log.map(({ a, p }) => { const d0 = (p.to || S.now) - p.from, over = d0 > cfg.single * MIN; return `<tr><td>${esc(a.name)}</td><td>${REASONS[p.r]}</td><td class="small">${timeS(p.from)}</td><td class="small">${p.to ? timeS(p.to) : '<span class="st unreachable">لسه واقف</span>'}</td>

/* agent presence bar and gate */
function agentBar() {
  const id = S.role, sh = shiftOf(id), pr = presence(id), sc = schedOf(id), cfg = S.settings.pause;
  const sched = (sc.end - sc.start) * H, w = workedMs(sh);
  const chip = pr === "working" ? '<span class="st success">شغال</span>' : pr === "paused" ? `<span class="st unreachable">واقف: ${REASONS[openPause(sh).r]}</span>` : pr === "done" ? '<span class="st">خلّصت يومك</span>' : '<span class="st">لسه مبدأتش</span>';

    ${sh ? `<span class="small">اشتغلت <b>${dur(w)}</b> من ${n(sc.end - sc.start)} س</span><div class="meter" style="width:120px"><i class="ok" style="width:${Math.min(100, (100 * w) / sched)}%"></i></div>
      <span class="small muted">بريك ${dur(pauseUsed(sh, "break"))} من ${n(cfg.break)} د</span>` : ""}
    <span style="flex:1"></span>

    <button class="btn primary" id="pStart">ابدأ يومي</button></div></section>`;
  if (pr === "done") return `<section class="card gate"><div class="empty"><b>خلّصت يومك</b><span>اشتغلت ${dur(workedMs(sh))}. لو قفلت بالغلط، تقدر ترجع.</span><button class="btn" id="pResume">رجوع للشغل</button></div></section>`;
  const op = openPause(sh), d0 = S.now - op.from, over = d0 > cfg.single * MIN, used = pauseUsed(sh, op.r), lim = cfg[op.r] * MIN;
  return `<section class="card gate ${over || used > lim ? "over" : ""}"><div class="empty">

}
function bindAgentPresence() {
  const id = S.role;
  const b = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  b("#pStart", () => { startShift(id); toast("بدأت يومك. بالتوفيق"); render(); });
  b("#pResume", () => { shiftOf(id).end = null; render(); });
  b("#pBack", () => { const op = openPause(shiftOf(id)); op.to = S.now; toast(`رجعت الشغل بعد ${dur(op.to - op.from)}`); render(); });
  b("#pEnd", () => confirmDlg({ title: "إنهاء اليوم؟", body: `اشتغلت ${dur(workedMs(shiftOf(id)))} النهارده. بعد الإنهاء مش هتقدر تعمل مكالمات لحد ما ترجع.`, action: "إنهاء اليوم", onOk: () => { shiftOf(id).end = S.now; render(); } }));
  b("#pPause", () => {
    const sh = shiftOf(id), cfg = S.settings.pause;
    const left = Math.max(0, cfg.break * MIN - pauseUsed(sh, "break"));
    confirmDlg({ title: "تبدأ بريك؟", body: `فاضلك من البريك النهارده ${dur(left)} من ${n(cfg.break)} د، والوقفة الواحدة متعديش ${n(cfg.single)} د. الوقت بيتحسب لحد ما تدوس «رجعت الشغل».`,
      action: "ابدأ البريك", onOk: () => { sh.pauses.push({ r: "break", from: S.now, to: null }); render(); } });
  });
}

    if (!(Number.isInteger(f.perDay) && f.perDay >= 1 && f.perDay <= 10)) return "أقصى محاولات في اليوم لازم تكون من ١ لـ ١٠.";
    if (!(Number.isInteger(f.maxTries) && f.maxTries >= 1 && f.maxTries <= 30)) return "عدد المحاولات قبل القفل لازم يكون من ١ لـ ٣٠.";
    if (f.dayEnd <= f.dayStart) return "آخر مواعيد الشغل لازم يكون بعد أولها.";
    const bad = S.agents.find((a) => f.sched[a.id] && f.sched[a.id].end <= f.sched[a.id].start);
    if (bad) return `مواعيد ${bad.name}: النهاية لازم تكون بعد البداية.`;
    if (!(Number.isInteger(f.pause.break) && f.pause.break >= 0 && f.pause.break <= 240) || !(Number.isInteger(f.pause.single) && f.pause.single >= 1 && f.pause.single <= 120)) return "دقايق الوقفات لازم تكون أرقام صحيحة (البريك من ٠ لـ ٢٤٠، والوقفة الواحدة من ١ لـ ١٢٠).";
    const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
    if (!int(f.cycle.noAnsLimit, 1, 10) || !int(f.cycle.holdMonths, 1, 12)) return "عدد مرات «لا يرد» من ١ لـ ١٠، ومدة التوقف من ١ لـ ١٢ شهر.";
    const al = f.alloc;
    if (!int(al.windowDays, 1, 60) || !int(al.days, 1, 10) || !int(al.minHistory, 0, 1000)) return "فترة القياس من ١ لـ ٦٠ يوم، والدفعة تكفي من ١ لـ ١٠ أيام.";
    if (!int(al.min, 1, 5000) || !int(al.max, 1, 5000) || !int(al.fresh, 1, 5000)) return "أحجام الدفعات لازم تكون أرقام صحيحة من ١ لـ ٥٠٠٠.";

        <td class="num"><b>${n(r.size)}</b></td></tr>`;
    }).join("");
    // walk one example donor who never answers, starting at the first working hour
    let t = dayStart(S.now) + f.dayStart * H, tries = 0, today = 0, day = dayStart(t); const steps = [];
    const stopAt = Math.min(f.maxTries, f.cycle.noAnsLimit);
    while (tries < stopAt && steps.length < 10) {
      steps.push(t); tries++; today++;
      if (tries >= stopAt) break;
      t = nextRetry(t, f.retry.no_answer, today, f);
      if (dayStart(t) !== day) { day = dayStart(t); today = 0; }
    }
    $("#setPrev").innerHTML = `مثال لمتبرع مبيردش خالص («لا يرد»): هيتكلم ${steps.map((x) => `<b>${when(x)}</b>`).join("، ")}${tries >= stopAt ? (f.cycle.noAnsLimit <= f.maxTries ? `، وبعدها يتوقف ${n(f.cycle.holdMonths)} شهور ويرجع لموظف تاني.` : `، وبعدها يتقفل «استنفد المحاولات».`) : "…"}`;
  };
  $$("[data-role]").forEach((el) => (el.onchange = () => {

  $$("[data-of]").forEach((el) => (el.onchange = () => { read(); if (el.value) f.teams.of[el.dataset.of] = Number(el.value); else delete f.teams.of[el.dataset.of]; render(); }));

  $("#setForm").onchange = () => { read(); preview(); };
  $("#setForm").onsubmit = (e) => { e.preventDefault(); read(); if (problem()) return preview(); S.settings = JSON.parse(JSON.stringify(f)); S.ui.setDraft = null; toast("اتحفظت الإعدادات"); render(); };
  $("#setReset").onclick = () => { S.ui.setDraft = null; render(); };
  $("#setDef").onclick = () => { S.ui.setDraft = { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), teams: f.teams, sched: f.sched, alloc: { ...DEFAULT_SETTINGS.alloc, excluded: f.alloc.excluded } }; render(); };
  preview();
};

V.team = () => {
  const ui = S.ui.team || (S.ui.team = { p: "today" });
  const range = periodRange(ui.p);
  const plabel = PERIODS.find(([k]) => k === ui.p)[1];
  const rows = S.agents.map((a) => {
    const mine = S.donors.filter((d) => d.agent === a.id);
    const s = stats(range, { agent: a.id }), today = stats(periodRange("today"), { agent: a.id });
    const src = S.batches.map((b) => ({ b, k: mine.filter((d) => d.batch === b.id).length, left: mine.filter((d) => d.batch === b.id && !d.attempts && !isClosed(d)).length })).filter((x) => x.k);

      ...agents.map(({ a, s }) => [a.name, s.calls, s.ansRate, s.donated, s.amount, s.pledged, s.pledgedAmt, s.interested, s.followReq, s.noAns, s.off, s.refused, s.badNum, s.dups, s.conv].join("\t"))].join("\n");

/* ================= agent views ================= */
/* ---- the agent works one call type at a time and never sees the list ---- */
const CATS = [
  { k: "donors", label: "المتبرعين بتوعي", icon: "heart", hint: "المتبرعين الحاليين المسندين ليك." },
  { k: "fresh", label: "الداتا الجديدة", icon: "files", hint: "متبرعين محتملين من دفعتك." },
  { k: "pledge", label: "تحصيل الوعود", icon: "share", hint: "ناس وعدت تتبرع ومعادها النهارده أو فات." },
  { k: "callback", label: "معاودة الاتصال", icon: "clock", hint: "ناس طلبت تكلمهم تاني في معاد النهارده." },
];
function catOf(d) {
  if (isClosed(d) || d.dnc) return null;
  const due = d.next === null || d.next <= S.now;
  if (d.status === "pledged") return due ? "pledge" : null;
  if (d.status === "callback") return due ? "callback" : null;
  if (!due) return null;                                         // later — not today's work yet
  return d.kind === "donor" ? "donors" : "fresh";
}
function catList(agentId, cat, batchId) {
  const list = mineOf(agentId).filter((d) => catOf(d) === cat && (!batchId || d.batch === batchId));
  return cat === "donors" || cat === "fresh" ? list.sort((a, b) => (a.next ?? Infinity) - (b.next ?? Infinity) || a.id - b.id) : list.sort((a, b) => (a.next ?? 0) - (b.next ?? 0) || a.id - b.id);
}
const catCount = (agentId, cat) => catList(agentId, cat).length;
const doneToday = (agentId, cat) => S.calls.filter((c) => c.agent === agentId && c.t >= dayStart(S.now) && c.cat === cat).length;

V.today = () => {
  const me = agentById(S.role), mine = mineOf(me.id);
  const today = stats(periodRange("today"), { agent: me.id });
  const myDonors = mine.filter((d) => d.kind === "donor"), myNew = mine.filter((d) => d.kind === "prospect" && !isClosed(d));
  const cnt = Object.fromEntries(CATS.map((c) => [c.k, catCount(me.id, c.k)]));
  const newWaiting = myNew.filter((d) => catOf(d) === null && d.next !== null).length;
  const rate = agentRate(me.id), poolLeft = idx().pool.length, auto = S.settings.alloc.auto && !S.settings.alloc.excluded.includes(me.id);
  const total = CATS.reduce((s, c) => s + cnt[c.k], 0);
  const small = (c) => { const k = cnt[c.k], done = doneToday(me.id, c.k); return `
      <button class="tile ${k ? "" : "done"}" type="button" data-cat="${c.k}" ${k ? "" : "disabled"}>
        <span class="tile-h"><span class="tile-ic">${ic(c.icon)}</span><b>${c.label}</b></span>
        <span class="tile-n"><b class="num">${n(k)}</b><span>${k ? "مكالمة مستنياك" : "خلصت"}</span></span>
        <span class="muted small">${c.hint}</span>
        <span class="tile-f"><span class="small muted">اتعمل النهارده: ${n(done)}</span>${k ? `<span class="tile-go">ابدأ ${ic("share")}</span>` : ""}</span>
      </button>`; };
  $("#main").innerHTML = `
    <div class="page-head"><div class="t"><h1>مكالمات النهارده</h1><span class="muted">أهلاً ${esc(me.name.split(" ")[0])} — ${dateS(S.now)}.</span></div></div>
    <div class="stats">
      <div class="stat"><span>مكالماتك النهارده</span><b>${n(today.calls)} <span class="muted" style="font-size:14px;font-weight:500">من ${n(me.target)}</span></b><div class="meter" style="margin-top:6px"><i class="${today.calls >= me.target ? "ok" : ""}" style="width:${Math.min(100, (100 * today.calls) / me.target)}%"></i></div></div>
      <div class="stat"><span>تبرعات النهارده</span><b>${money(today.amount)}</b><small>${n(today.donated)} تبرع</small></div>
      <div class="stat"><span>وعود النهارده</span><b>${money(today.pledgedAmt)}</b><small>${n(today.pledged)} وعد</small></div>
      <div class="stat"><span>فاضل عليك النهارده</span><b>${n(total)}</b><small>مكالمة في كل الأقسام</small></div>
    </div>
    <div class="split">
      <section class="card section-card"><div class="card-h"><h2>${ic("heart")}المتبرعين بتوعي</h2><button class="btn ghost sm" id="seeDonors">عرض المتبرعين</button></div>
        <div class="card-b"><div class="big-pair"><div><b class="num">${n(myDonors.length)}</b><span>متبرع مسند ليك</span></div><div><b class="num">${n(cnt.donors)}</b><span>جاهز للاتصال دلوقتي</span></div></div>
          <p class="muted small">أي متبرع محتمل يتبرع معاك بيتنقل هنا ويفضل معاك بسجل مكالماته.</p>
          <div class="actions"><button class="btn primary" data-cat="donors" ${cnt.donors ? "" : "disabled"}>${cnt.donors ? "ابدأ الاتصال" : "مفيش حد جاهز دلوقتي"}</button></div></div></section>
      <section class="card section-card"><div class="card-h"><h2>${ic("files")}الداتا الجديدة</h2><span class="muted small">${auto ? `دفعتك حوالي ${n(rate.size)} اسم` : "التوزيع التلقائي مقفول ليك"}</span></div>
        <div class="card-b"><div class="big-pair"><div><b class="num">${n(cnt.fresh)}</b><span>اسم متاح للعمل</span></div><div><b class="num">${n(newWaiting)}</b><span>مستني معاد متابعة</span></div></div>
          <p class="muted small">${auto ? (poolLeft ? "أول ما تخلص الأسماء الجاهزة، بتتسندلك دفعة جديدة لوحدها." : "المخزون فاضي دلوقتي. لما المدير يرفع داتا جديدة هتوصلك دفعة لوحدها.") : "المدير هيسندلك الداتا الجديدة بإيده."}</p>
          <div class="actions"><button class="btn primary" data-cat="fresh" ${cnt.fresh ? "" : "disabled"}>${cnt.fresh ? "ابدأ الداتا الجديدة" : "مفيش أسماء جاهزة"}</button></div></div></section>
    </div>
    <div class="tiles">${CATS.filter((c) => c.k === "pledge" || c.k === "callback").map(small).join("")}</div>`;
  $$("[data-cat]").forEach((b) => (b.onclick = () => go("c-" + b.dataset.cat)));
  $("#seeDonors").onclick = () => go("my-donors");
};

/* the agent's own donors, page by page */
V["my-donors"] = () => {
  const ui = S.ui.myd || (S.ui.myd = { q: "", page: 1 });
  const all = mineOf(S.role).filter((d) => d.kind === "donor").sort((a, b) => (catOf(a) ? 0 : 1) - (catOf(b) ? 0 : 1) || (b.convertedAt || 0) - (a.convertedAt || 0) || a.id - b.id);
  $("#main").innerHTML = `
    <div class="page-head"><div class="t"><span class="crumb"><a href="#" data-back>مكالمات النهارده</a> / المتبرعين بتوعي</span><h1>المتبرعين بتوعي</h1><span class="muted">${n(all.length)} متبرع مسند ليك. اللي جاهز للاتصال دلوقتي فوق.</span></div>
      <div class="search">${ic("search")}<input class="input" id="mq" placeholder="ابحث بالاسم أو الرقم" value="${esc(ui.q)}" aria-label="ابحث في المتبرعين بتوعي"></div></div>
    <section class="card" id="mdT"></section>`;

      ${pg.rows.map((d) => { const c = catOf(d); return `<tr class="link" data-donor="${d.id}"><td><b>${esc(d.name)}</b> ${d.convertedAt ? kindTag(d) : ""}</td>
        <td><span class="ltr num">${esc(goodPhones(d)[0]?.n || d.phones[0].n)}</span></td><td>${st(d.status)}</td>

        <td>${c ? `<button class="btn sm primary" data-call="${d.id}" data-c="${c}">${ic("phone")}اتصل</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>${pagerHtml("mdPg", pg, list.length)}`
      : empty(q ? "مفيش نتايج" : "مفيش متبرعين مسندين ليك لسه", q ? "جرّب اسم أو رقم تاني." : "المدير بيسندلك المتبرعين، وأي محتمل يتبرع معاك بيظهر هنا.");

    $$("[data-call]", $("#mdT")).forEach((b) => (b.onclick = () => { S.ui.cur = Number(b.dataset.call); S.ui.form = null; go("c-" + b.dataset.c); }));
  };

  let t; $("#mq").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { ui.q = e.target.value; ui.page = 1; draw(); }, 200); };
  draw();
};

function catView(cat) {
  const me = agentById(S.role), c = CATS.find((x) => x.k === cat);
  const ui = S.ui.cat?.[cat] || ((S.ui.cat = S.ui.cat || {})[cat] = { skip: [], batch: null });
  const bySheet = cat === "donors" || cat === "fresh";
  const sheets = bySheet ? S.batches.map((b) => ({ b, k: catList(me.id, cat, b.id).length })).filter((x) => x.k) : [];
  if (ui.batch && !sheets.some((x) => x.b.id === ui.batch)) ui.batch = null;
  const list = catList(me.id, cat, ui.batch);
  let cur = list.find((d) => d.id === S.ui.cur);
  if (!cur) {
    cur = list.find((d) => !ui.skip.includes(d.id)) || null;
    if (!cur && list.length) { ui.skip = []; cur = list[0]; }
    S.ui.cur = cur?.id ?? null; S.ui.form = null;
  }
  const done = doneToday(me.id, cat);
  $("#main").innerHTML = `
    <div class="page-head"><div class="t"><span class="crumb"><a href="#" data-back>مكالمات النهارده</a> / ${c.label}</span><h1>${c.label}</h1><span class="muted">${c.hint}</span></div>
      <div class="actions"><span class="pill">فاضل <b class="num">${n(list.length)}</b></span><span class="pill">اتعمل النهارده <b class="num">${n(done)}</b></span></div></div>
    ${sheets.length > 1 ? `<div class="field"><span>من أنهي شيت؟</span>${segHtml("shSeg", [["", `كل الشيتات (${n(catCount(me.id, cat))})`], ...sheets.map((x) => [String(x.b.id), `${x.b.name} (${n(x.k)})`])], ui.batch ? String(ui.batch) : "")}</div>` : ""}
    ${cur ? `<section class="card call-solo" id="callCard"></section>`
      : `<section class="card">${empty(`خلصت ${c.label}`, cat === "fresh" && S.settings.alloc.auto ? (idx().pool.length ? "الدفعة الجاية بتتسندلك دلوقتي." : "المخزون فاضي دلوقتي. لما المدير يرفع داتا جديدة هتوصلك دفعة لوحدها.") : "مفيش مكالمات من النوع ده دلوقتي. ارجع لمكالمات النهارده واختار قسم تاني.", `<button class="btn primary" data-back2>مكالمات النهارده</button>`)}</section>`}`;
  $("[data-back]").onclick = (e) => { e.preventDefault(); go("today"); };
  const b2 = $("[data-back2]"); if (b2) b2.onclick = () => go("today");
  bindSeg("shSeg", (v) => { ui.batch = v ? Number(v) : null; S.ui.cur = null; render(); });
  if (cur) callCard(cur, cat, list.length);
}
CATS.forEach((c) => (V["c-" + c.k] = () => catView(c.k)));

function callCard(d, cat, left) {
  const firstGood = d.phones.findIndex((p) => !p.bad);
  const f = S.ui.form && S.ui.form.id === d.id ? S.ui.form : (S.ui.form = { id: d.id, outcome: null, phone: firstGood, amount: d.status === "pledged" ? d.pledge : "", pay: PAYMENTS[0], follow: "", notes: "" });
  const o = f.outcome ? OC[f.outcome] : null;
  const isPledge = o?.code === "pledged";
  const followOpts = isPledge ? [["1d", "بعد يوم"], ["2d", "بعد يومين"], ["wk", "بعد أسبوع"], ["pick", "اختار يوم"]]
    : [["2h", "بعد ساعتين"], ["eve", "النهارده بالليل"], ["tom", "بكرة الصبح"], ["2d", "بعد يومين"], ["wk", "بعد أسبوع"]];
  const isoDay = (t) => { const x = new Date(t), z = (v) => String(v).padStart(2, "0"); return `${x.getFullYear()}-${z(x.getMonth() + 1)}-${z(x.getDate())}`; };
  const workStart = (day) => day + S.settings.dayStart * H;   // pledges are due at the start of that working day
  const followAt = (k) => {
    const d0 = dayStart(S.now);
    if (isPledge) {
      if (k === "pick") return f.pickDate ? workStart(dayStart(new Date(f.pickDate + "T00:00").getTime())) : null;
      return workStart(d0 + { "1d": 1, "2d": 2, wk: 7 }[k] * D);
    }
    return { "2h": S.now + 2 * H, eve: Math.max(d0 + 19 * H, S.now + H), tom: d0 + D + 11 * H, "2d": d0 + 2 * D + 11 * H, wk: d0 + 7 * D + 11 * H }[k];
  };
  const lastCall = S.calls.filter((c) => c.donor === d.id).sort((a, b) => b.t - a.t)[0];
  const box = $("#callCard");
  box.innerHTML = `<div class="card-b">
    <div class="donor-h"><div><h2>${esc(d.name)} ${kindTag(d)}</h2><div class="meta"><span>${esc(batchById(d.batch).name)}</span><span>${d.attempts ? `${n(d.attempts)} محاولة قبل كده` : "أول مرة نكلمه"}</span>${d.total ? `<span>اتبرع قبل كده بـ ${money(d.total)}</span>` : ""}</div></div>
      <div class="actions">${d.status === "new" ? "" : st(d.status)}</div></div>
    ${d.status === "pledged" ? `<p class="note">وعد بـ <b>${money(d.pledge)}</b> ومعاد التحصيل ${when(d.pledgeDue)}. لو دفع اختار «اتبرع».</p>` : ""}
    ${lastCall?.notes ? `<p class="note">آخر ملاحظة (${when(lastCall.t)}): «${esc(lastCall.notes)}»</p>` : ""}
    ${d.notes ? `<p class="note warn">ملاحظة من الشيت: ${esc(d.notes)}</p>` : ""}
    <div class="field"><span>اتصلت على أنهي رقم؟</span><div class="phones">${d.phones.map((p, i) => `<div class="phone ${p.bad ? "bad" : ""}">
      <label><input type="radio" name="ph" value="${i}" ${i === f.phone ? "checked" : ""} ${p.bad ? "disabled" : ""}><span class="n ltr">${esc(p.n)}</span>${p.bad ? '<span class="st invalid">غير صالح</span>' : ""}</label>
      ${p.bad ? "" : `<button class="btn sm" type="button" data-cp="${esc(p.n)}">${ic("copy")}نسخ الرقم</button>`}</div>`).join("")}</div></div>
    <div class="field"><span class="req">نتيجة المكالمة</span><div class="ogroups">${GROUPS.map(([g, gl]) => `<div class="og"><h3>${gl}</h3><div class="opts">${OUTCOMES.filter((x) => x.group === g).map((x) => `<button type="button" class="opt c-${x.cat}" data-oc="${x.code}" aria-pressed="${f.outcome === x.code}">${esc(x.label)}</button>`).join("")}</div></div>`).join("")}</div></div>
    ${o ? `${o.amount || o.code === "donated" ? `<div class="form-row">
      ${o.amount ? `<label class="field"><span class="req">${o.code === "pledged" ? "المبلغ اللي وعد بيه" : "مبلغ التبرع"} (ج.م)</span><input class="input num" type="number" min="1" id="amt" value="${esc(f.amount)}" inputmode="numeric"><span class="hint" id="amtErr" role="alert" style="color:var(--bad)"></span></label>` : ""}
      ${o.code === "donated" ? `<label class="field"><span>طريقة الدفع</span><select class="input" id="pay">${PAYMENTS.map((p) => `<option ${p === f.pay ? "selected" : ""}>${p}</option>`).join("")}</select></label>` : ""}
    </div>` : ""}
    ${o.follow ? `<div class="field"><span class="${o.follow === "req" ? "req" : ""}">${o.code === "pledged" ? "معاد التحصيل" : o.group === "none" ? "تتصل تاني إمتى؟ (اختياري)" : "معاد المتابعة"}</span>
      <div class="chips" role="group">${followOpts.map(([k, l]) => `<button type="button" class="chip-btn" data-fu="${k}" aria-pressed="${f.follow === k}">${k === "pick" ? ic("cal") : ""}${l}</button>`).join("")}</div>
      ${isPledge && f.follow === "pick" ? `<input class="input" type="date" id="pickDay" min="${isoDay(S.now + D)}" max="${isoDay(S.now + 120 * D)}" value="${esc(f.pickDate || "")}" aria-label="يوم التحصيل" style="max-width:200px">` : ""}
      ${isPledge && f.follow && followAt(f.follow) ? `<span class="small">معاد التحصيل: <b>${new Date(followAt(f.follow)).toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" })}</b></span>` : ""}
      <span class="hint" id="fuErr" role="alert">${o.group === "none" ? `لو مختارتش، هيرجعلك ${when(nextRetry(S.now, S.settings.retry[o.code], S.calls.filter((c) => c.donor === d.id && c.t >= dayStart(S.now) && OC[c.outcome].group === "none").length + 1))}. ${o.code === "no_answer" ? "" : `بعد ${n(S.settings.maxTries)} مرات ورا بعض من غير رد بيتقفل.`}` : ""}</span></div>` : ""}
    ${o.group === "num" ? `<p class="note warn">الرقم ده هيتعلّم إنه غير صالح.${goodPhones(d).length > 1 ? " المتبرع هيرجعلك على رقمه التاني." : " ده آخر رقم صالح، فالمتبرع هيتقفل."}</p>` : ""}
    ${o.code === "donated" && d.kind === "prospect" ? `<p class="note">ده متبرع محتمل. بعد الحفظ هيتنقل لـ«المتبرعين بتوعي» ويفضل معاك بسجل مكالماته.</p>` : ""}
    ${o.code === "no_answer" ? `<p class="note ${(d.noAns || 0) + 1 >= S.settings.cycle.noAnsLimit ? "warn" : ""}">دي «لا يرد» رقم ${n((d.noAns || 0) + 1)} من ${n(S.settings.cycle.noAnsLimit)}.${(d.noAns || 0) + 1 >= S.settings.cycle.noAnsLimit ? ` الاسم هيتوقف ${n(S.settings.cycle.holdMonths)} شهور ويرجع بعدها لموظف تاني.` : ""}</p>` : ""}
    ${o.code === "not_interested" ? `<p class="note warn">الاسم هيخرج من شغلك ويتوقف ${n(S.settings.cycle.holdMonths)} شهور، وبعدها يرجع للتوزيع على موظف تاني.</p>` : ""}
    ${o.code === "do_not_call" ? `<p class="note warn">الاسم هيتقفل نهائيًا ومش هيتوزع على حد تاني أبدًا.</p>` : ""}` : ""}
    <label class="field"><span>ملاحظات</span><textarea class="input" id="notes" rows="2" placeholder="مثال: بيفضّل الاتصال بعد المغرب">${esc(f.notes)}</textarea></label>
    ${d.attempts ? `<details><summary class="small" style="cursor:pointer">سجل مكالماته (${n(S.calls.filter((c) => c.donor === d.id).length)})</summary><div style="margin-top:8px">${timeline(d)}</div></details>` : ""}
  </div>
  <div class="sticky-f"><button class="btn primary" id="saveNext" ${o ? "" : "disabled"}>${left > 1 ? "حفظ والمكالمة اللي بعدها" : "حفظ"}</button>
    ${left > 1 ? `<button class="btn" id="skip" title="هيرجعلك في آخر النوع ده">تخطّي دلوقتي</button>` : ""}
    <button class="btn danger" id="dupBtn" title="المتبرع ده متكرر في الداتا">مكرر</button>
    <span class="muted small">${o ? "" : "اختار نتيجة المكالمة الأول"}</span></div>`;
  const keep = () => { f.notes = $("#notes").value; if ($("#amt")) f.amount = $("#amt").value; if ($("#pay")) f.pay = $("#pay").value; const ph = $('input[name="ph"]:checked'); if (ph) f.phone = Number(ph.value); };
  const redraw = () => callCard(d, cat, left);
  $$("[data-oc]", box).forEach((b) => (b.onclick = () => { keep(); f.outcome = b.dataset.oc; f.follow = f.outcome === "pledged" ? "" : OC[f.outcome].follow === "req" ? "tom" : ""; redraw(); }));
  const pd = $("#pickDay", box); if (pd) pd.onchange = () => { keep(); f.pickDate = pd.value; redraw(); };
  $$("[data-fu]", box).forEach((b) => (b.onclick = () => { keep(); f.follow = f.follow === b.dataset.fu && OC[f.outcome].follow !== "req" ? "" : b.dataset.fu; redraw(); }));
  $$('input[name="ph"]', box).forEach((r) => (r.onchange = keep));
  $$("[data-cp]", box).forEach((b) => (b.onclick = () => { if (navigator.clipboard?.writeText) navigator.clipboard.writeText(b.dataset.cp).then(() => toast("اتنسخ الرقم"), () => {}); }));
  $("#dupBtn").onclick = () => confirmDlg({ title: `${d.name} مكرر؟`, body: "هيخرج من شغلك ويتسجل عند المدير تحت بند «مكرر». مش هيتحسب كمكالمة.", action: "أيوه مكرر", danger: true, onOk: () => {
    keep(); logCall(d, S.role, { outcome: "duplicate", phone: f.phone, notes: f.notes }); S.calls[S.calls.length - 1].cat = cat;
    toast(`اتعلّم ${d.name} مكرر`); S.ui.form = null; S.ui.cur = null; render(); window.scrollTo(0, 0); } });
  const sk = $("#skip"); if (sk) sk.onclick = () => { S.ui.cat[cat].skip.push(d.id); S.ui.cur = null; S.ui.form = null; render(); };
  $("#saveNext").onclick = () => {
    keep();
    if (o.amount && !(Number(f.amount) > 0)) { $("#amtErr").textContent = "اكتب المبلغ"; $("#amt").focus(); return; }
    if (o.follow === "req" && !f.follow) { $("#fuErr").textContent = isPledge ? "اختار معاد التحصيل" : "اختار المعاد"; return; }
    if (isPledge && f.follow === "pick" && !(f.pickDate && followAt("pick") > S.now)) { $("#fuErr").textContent = "اختار يوم من الكالندر (من بكرة وطالع)"; return; }
    const conv = logCall(d, S.role, { outcome: o.code, phone: f.phone, amount: o.amount ? Number(f.amount) : null, pay: o.code === "donated" ? f.pay : null, follow: f.follow ? followAt(f.follow) : null, notes: f.notes });
    S.calls[S.calls.length - 1].cat = cat;
    S.now += 3 * MIN;
    const held = d.status === "hold";
    toast(conv ? `${d.name} اتبرع واتنقل لـ«المتبرعين بتوعي»` : held ? `اتسجل: ${o.label} — الاسم اتوقف لحد ${dateS(d.holdUntil)}` : `اتسجل: ${o.label}`);
    S.ui.form = null; S.ui.cur = null;
    render(); window.scrollTo(0, 0);
  };
}

V.mine = () => {
  const ui = S.ui.mine || (S.ui.mine = { p: "today" });
  const s = stats(periodRange(ui.p), { agent: S.role });
  const cs = [...s.cs].sort((a, b) => b.t - a.t);
  const counts = OUTCOMES.map((o) => ({ o, k: s.cs.filter((c) => c.outcome === o.code).length })).filter((x) => x.k);
  const maxC = Math.max(1, ...counts.map((x) => x.k));
  $("#main").innerHTML = `
    <div class="page-head"><div class="t"><h1>أدائي</h1></div>${segHtml("mSeg", PERIODS, ui.p)}</div>
    <div class="stats"><div class="stat"><span>مكالمات</span><b>${n(s.calls)}</b><small>رد ${pctS(s.ansRate)}</small></div>
      <div class="stat"><span>تبرعات</span><b>${money(s.amount)}</b><small>${n(s.donated)} متبرع</small></div>
      <div class="stat"><span>وعود</span><b>${money(s.pledgedAmt)}</b><small>${n(s.pledged)} وعد · اتحصّل ${n(s.fulfilled)}</small></div>
      <div class="stat"><span>التحويل</span><b>${pctS(s.conv)}</b><small>من اللي ردوا اتبرعوا</small></div></div>
    <div class="grid">
      <section class="card"><div class="card-h"><h2>نتايج مكالماتي</h2></div><div class="card-b bars">${counts.length ? counts.map(({ o, k }) => `<div class="bar"><span>${esc(o.label)}</span><div class="meter"><i class="${CLS[o.cat]}" style="width:${(100 * k) / maxC}%"></i></div><span class="v">${n(k)}</span></div>`).join("") : '<p class="muted">مفيش مكالمات في الفترة دي.</p>'}</div></section>
      <section class="card"><div class="card-h"><h2>آخر مكالماتي</h2></div>${cs.length ? `<div class="tw" style="max-height:420px"><table><thead><tr><th>الوقت</th><th>المتبرع</th><th>النتيجة</th><th class="num">المبلغ</th></tr></thead><tbody>
        ${cs.slice(0, 100).map((c) => `<tr><td class="small">${when(c.t)}</td><td>${esc(S.donors.find((d) => d.id === c.donor).name)}</td><td>${st(c.outcome)}</td><td class="num">${c.amount ? money(c.amount) : "—"}</td></tr>`).join("")}</tbody></table></div>` : empty("مفيش مكالمات", "غيّر الفترة من فوق.")}</section>
    </div>`;
  bindSeg("mSeg", (v) => { ui.p = v; render(); });
};

/* ================= prototype controls ================= */
$("#asRole").onchange = (e) => { S.role = e.target.value === "manager" ? "manager" : Number(e.target.value); S.ui.cur = null; S.ui.form = null; go(S.role === "manager" ? "home" : "today"); };
$("#plus15").onclick = () => { S.now += 15 * MIN; render(); };
$("#plusH").onclick = () => { S.now += H; render(); };
$("#plusW").onclick = () => { S.now = dayStart(S.now) + 7 * D + 10 * H; toast("اتقدّم الوقت أسبوع"); render(); };
$("#plusM").onclick = () => { S.now = addMonths(dayStart(S.now), 1) + 10 * H; toast("اتقدّم الوقت شهر"); render(); };
$("#plusD").onclick = () => { S.now = dayStart(S.now) + D + 10 * H; toast("بدأ يوم شغل جديد — الساعة ١٠ الصبح"); render(); };
if ($("#simDay")) $("#simDay").onclick = () => { const k = simulate(.8); toast(`الفريق عمل ${n(k)} مكالمة`); render(); };
$("#resetBtn").onclick = () => confirmDlg({ title: "مسح كل البيانات؟", body: "كل الشيتات والمكالمات والحضور اللي سجلتهم هيتمسحوا، والإعدادات ترجع للأول. الحسابات (المدير والتيم ليدرز والايجنتس) هتفضل.", action: "مسح كل البيانات", danger: true, onOk: () => { seed(); render(); saveNow(); toast("اتمسحت كل البيانات"); } });

const DB = "callcenter-test", OLD_KEY = "callcenter-test-v1";
function idb(mode, fn) {
  return new Promise((ok, bad) => {
    const open = indexedDB.open(DB, 1);
    open.onupgradeneeded = () => open.result.createObjectStore("s");
    open.onerror = () => bad(open.error);
    open.onsuccess = () => { const tx = open.result.transaction("s", mode), req = fn(tx.objectStore("s")); tx.oncomplete = () => ok(req.result); tx.onerror = () => bad(tx.error); };
  });
}
let saveTimer = null, lastSaveMs = 0;
async function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  const t0 = performance.now();
  try { await idb("readwrite", (st) => st.put({ ...S, r: null, ui: {} }, "state")); lastSaveMs = performance.now() - t0; }
  catch (e) { toast("معرفناش نحفظ البيانات في المتصفح. التغييرات هتفضل لحد ما تقفل الصفحة بس."); }
}
/* saving 300k names takes a moment, so changes are batched into one save */
function persist() { if (!saveTimer) saveTimer = setTimeout(saveNow, Math.min(8000, 1500 + lastSaveMs * 3)); }
window.addEventListener("pagehide", () => { if (saveTimer) saveNow(); });
function upgrade(saved) {
  // state saved by an older version of this file
  saved.settings = { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), ...saved.settings };
  saved.settings.alloc = { ...DEFAULT_SETTINGS.alloc, ...(saved.settings.alloc || {}) };
  saved.settings.cycle = { ...DEFAULT_SETTINGS.cycle, ...(saved.settings.cycle || {}) };
  saved.allocLog = saved.allocLog || [];
  return { ...saved, r: rng(11), ui: {}, role: "manager", view: "home", param: null, now: Math.max(saved.now, Date.now()) };
}
const renderInner = render;
render = function () { renderInner(); persist(); };
(async () => {
  let saved = null;
  try { saved = await idb("readonly", (st) => st.get("state")); } catch { /* storage blocked */ }
  if (!saved) { try { saved = JSON.parse(localStorage.getItem(OLD_KEY) || "null"); } catch { saved = null; } }
  if (saved && saved.agents) S = upgrade(saved); else seed();
  render();
})();
/* the simulated clock also runs in real time; only live counters update, the page is not redrawn */
setInterval(() => {
  if (!S) return;
  S.now += 1000;
  if (Math.floor(S.now / 1000) % 60 === 0) persist();
  $$("[data-since]").forEach((el) => (el.textContent = dur(S.now - Number(el.dataset.since))));
  if (Math.floor(S.now / 1000) % 30 === 0) {
    $("#clock").textContent = when(S.now);
    updateAlarm();
    if (S.view === "attendance" && S.role === "manager" && !$("#dlg").open && !$("#drawer").open) render();
  }
}, 1000);
</script>
